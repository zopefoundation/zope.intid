# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "zope.intid"
version = "6.1.dev0"
description = "Integer Id Utility"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: Zope :: 3",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Albertas Agejevas and Gintautas Miliauskas",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "persistent",
    "BTrees",
    "setuptools",
    "zope.lifecycleevent>=3.5.2",
    "zope.component",
    "zope.event",
    "zope.interface",
    "zope.keyreference",
    "zope.location>=3.5.4",
    "zope.security",
]
keywords = ["zope3", "integer", "id", "utility"]

[project.optional-dependencies]
test = [
    "ZODB",
    "zope.testing",
    "zope.site",
    "zope.traversing",
    "zope.container",
]
docs = [
    "repoze.sphinx.autointerface",
    "sphinx_rtd_theme",
    "Sphinx",
]

[project.urls]
Source = "http://github.com/zopefoundation/zope.intid"

[tool.coverage.run]
branch = true
source = ["zope.intid"]

[tool.coverage.report]
fail_under = 99
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}
